<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Password-reset modal fragment.

  Usage (in any page template):
    <th:block th:if="${showPasswordReset}"
              th:replace="~{fragments/password-reset-modal :: password-reset-modal}">
    </th:block>

  Behaviour:
    - Renders a full-viewport overlay that blocks all interaction with the page behind it.
    - Cannot be dismissed by clicking outside or pressing Escape.
    - The only way to close it is a successful submission (POST /api/reset-password).
    - The Reset button clears both input fields (client-side only).
-->

<div th:fragment="password-reset-modal" id="pwResetOverlay" class="pwr-overlay">
  <div class="pwr-dialog" role="dialog" aria-modal="true" aria-labelledby="pwrTitle">

    <!-- Header -->
    <div class="pwr-header">
      <!-- Key icon -->
      <svg class="pwr-header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="8" cy="15" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 15h8M17 13v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span id="pwrTitle" class="pwr-title">Set Your Password</span>
    </div>

    <p class="pwr-subtitle">
      You are using the default password. Please set a new password to continue.
    </p>

    <!-- Error message (hidden until a failed call) -->
    <div id="pwrError" class="pwr-error" style="display:none;"></div>

    <!-- Existing Password field -->
    <div class="pwr-field">
      <span class="pwr-field-icon" aria-hidden="true">
        <!-- Padlock icon -->
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="10" cy="13.5" r="1.2" fill="currentColor"/>
        </svg>
      </span>
      <input type="password" id="pwrCurrent" class="pwr-input"
             placeholder="Existing Password" autocomplete="current-password" required/>
    </div>

    <!-- New Password field -->
    <div class="pwr-field">
      <span class="pwr-field-icon" aria-hidden="true">
        <!-- Key icon -->
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7.5" cy="12.5" r="3.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M11 12.5h6M14.5 10.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="password" id="pwrNew" class="pwr-input"
             placeholder="New Password" autocomplete="new-password" required/>
    </div>

    <!-- Action buttons -->
    <div class="pwr-actions">
      <!-- Reset button — clears both fields, client-side only -->
      <button type="button" class="pwr-btn pwr-btn-reset" id="pwrResetBtn" onclick="pwrClearFields()">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 10a6 6 0 1 1 1.76 4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4 14V10H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Reset
      </button>

      <!-- Submit button — calls /api/reset-password -->
      <button type="button" class="pwr-btn pwr-btn-submit" id="pwrSubmitBtn" onclick="pwrSubmit()">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 10l5 5 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Submit
      </button>
    </div>
  </div>

  <script>
    /* Block clicks on the backdrop — the dialog can only be closed via Submit */
    document.getElementById('pwResetOverlay').addEventListener('mousedown', function(e) {
      e.stopPropagation();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') e.preventDefault();
    });

    function pwrClearFields() {
      document.getElementById('pwrCurrent').value = '';
      document.getElementById('pwrNew').value = '';
      document.getElementById('pwrError').style.display = 'none';
    }

    function pwrSubmit() {
      var current = document.getElementById('pwrCurrent').value;
      var next    = document.getElementById('pwrNew').value;
      var errEl   = document.getElementById('pwrError');
      var btn     = document.getElementById('pwrSubmitBtn');

      if (!current || !next) {
        errEl.textContent = 'Both fields are required.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: current, newPassword: next })
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
      .then(function(res) {
        if (res.ok && res.data.success) {
          document.getElementById('pwResetOverlay').style.display = 'none';
        } else {
          errEl.textContent = (res.data && res.data.error) ? res.data.error : 'An error occurred.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 10l5 5 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Submit';
        }
      })
      .catch(function() {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 10l5 5 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Submit';
      });
    }
  </script>
</div>

</body>
</html>
