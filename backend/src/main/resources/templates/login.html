<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign In — Vacation Planner Assistant</title>
    <link rel="stylesheet" th:href="@{/static/login.css}">
</head>
<body>

<div class="card">

    <!-- Animated robot avatar -->
    <div class="avatar-wrap">
        <!--
            Robot SVG redrawn at the same 120×130 viewBox.
            Colours shifted to deeper royal blue (#1c3fa0 body, #173296 neck/arms/legs,
            #3b9eff antenna tip) to match the darker palette in the reference screenshot.
        -->
        <svg class="robot-svg" viewBox="0 0 120 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="robot-body-group">
                <!-- Antenna stem -->
                <rect x="58" y="6" width="4" height="18" rx="2" fill="#1c3fa0"/>
                <!-- Antenna tip — pulsing; fix 3.2: vivid cyan-blue -->
                <circle class="robot-antenna-tip" cx="60" cy="5" r="4" fill="#3b9eff"/>

                <!-- Head; fix 3.3: deeper royal blue -->
                <rect x="28" y="22" width="64" height="46" rx="14" fill="#1c3fa0"/>

                <!-- Eyes -->
                <rect class="robot-eye" x="38" y="36" width="16" height="16" rx="5" fill="#fff"/>
                <rect class="robot-eye" x="66" y="36" width="16" height="16" rx="5" fill="#fff"/>
                <!-- Eye pupils -->
                <circle cx="46" cy="44" r="5" fill="#0d2260"/>
                <circle cx="74" cy="44" r="5" fill="#0d2260"/>
                <!-- Eye shine -->
                <circle cx="48" cy="41" r="2" fill="#7ec8fa"/>
                <circle cx="76" cy="41" r="2" fill="#7ec8fa"/>

                <!-- Mouth / speaker grille -->
                <rect class="robot-mouth" x="44" y="57" width="32" height="5" rx="2.5" fill="#7ec8fa"/>

                <!-- Neck -->
                <rect x="54" y="68" width="12" height="8" rx="3" fill="#173296"/>

                <!-- Body -->
                <rect x="22" y="76" width="76" height="44" rx="14" fill="#1c3fa0"/>

                <!-- Body panel dots -->
                <circle cx="44" cy="98" r="5" fill="#0d2260"/>
                <circle cx="60" cy="98" r="5" fill="#3b9eff"/>
                <circle cx="76" cy="98" r="5" fill="#0d2260"/>

                <!-- Body panel line -->
                <rect x="34" y="109" width="52" height="4" rx="2" fill="#173296"/>

                <!-- Arms -->
                <rect class="robot-arm-l" x="4" y="78" width="18" height="30" rx="9" fill="#173296"/>
                <rect class="robot-arm-r" x="98" y="78" width="18" height="30" rx="9" fill="#173296"/>

                <!-- Legs -->
                <rect x="34" y="120" width="18" height="10" rx="5" fill="#173296"/>
                <rect x="68" y="120" width="18" height="10" rx="5" fill="#173296"/>
            </g>
        </svg>
    </div>

    <h1 class="card-title">Vacation Planner Assistant</h1>
    <p class="card-sub">Sign in to continue</p>

    <!-- Error message -->
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <form method="POST" th:action="@{/login}">

        <div class="field">
            <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">
                    <!-- User / person icon -->
                    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="7" r="3.5" stroke="#111827" stroke-width="1.6"/>
                        <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </span>
                <input type="text"
                       id="username" name="username"
                       aria-label="Username"
                       autocomplete="username"
                       placeholder="Username"
                       required>
            </div>
        </div>

        <div class="field">
            <div class="input-wrap">
                <span class="field-icon" aria-hidden="true">
                    <!-- Padlock icon -->
                    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="9" width="12" height="9" rx="2" stroke="#111827" stroke-width="1.6"/>
                        <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
                        <circle cx="10" cy="13.5" r="1.2" fill="#111827"/>
                    </svg>
                </span>
                <input type="password"
                       id="password" name="password"
                       aria-label="Password"
                       autocomplete="current-password"
                       placeholder="Password"
                       required>
            </div>
        </div>

        <button type="submit" class="btn-signin">Sign in</button>
    </form>
</div>
</body>
</html>
