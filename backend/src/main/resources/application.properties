spring.application.name=holiday-leave-assistant

# Server
server.port=${FLASK_PORT:8080}
server.servlet.session.timeout=${PERMANENT_SESSION_LIFETIME:3600}s

# Suppress Spring Security's auto-generated password warning.
# Authentication is handled by AuthInterceptor + BCrypt (not Spring's UserDetailsService).
spring.security.user.name=unused
spring.security.user.password=unused

# Session
spring.session.store-type=none

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# App Config (all override-able via env vars / .env)
app.data-dir=${DATA_DIR:data}
app.excluded-city-list=${EXCLUDED_CITY_LIST:}
app.report-output-dir=${REPORT_OUTPUT_DIR:reports}
app.excel-file-paths=${EXCEL_FILE_PATHS:}
app.sync-interval-seconds=${SYNC_INTERVAL_SECONDS:300}

# Auth
app.login-username=${LOGIN_USERNAME:admin}
app.login-password-hash=${LOGIN_PASSWORD_HASH:}

# LLM
app.llm.api-key=${OPENAI_API_KEY:}
app.llm.base-url=${LLM_BASE_URL:http://127.0.0.1:11434/v1}
app.llm.model=${LLM_MODEL:llama3.2}
app.llm.temperature=${LLM_TEMPERATURE:0.0}
app.llm.max-tokens=${LLM_MAX_TOKENS:1024}
app.llm.watsonx-project-id=${WATSONX_PROJECT_ID:}
# Max conversation turns kept in history (entries = pairs × 2; default 6 = 3 pairs)
app.llm.history-window=${LLM_HISTORY_WINDOW:6}

# IBM Box sync
app.box.enabled=${BOX_ENABLED:false}
app.box.client-id=${BOX_CLIENT_ID:}
app.box.client-secret=${BOX_CLIENT_SECRET:}
app.box.enterprise-id=${BOX_ENTERPRISE_ID:}
app.box.folder-id=${BOX_FOLDER_ID:}
app.box.jwt-private-key=${BOX_JWT_PRIVATE_KEY:}
app.box.jwt-private-key-passphrase=${BOX_JWT_PRIVATE_KEY_PASSPHRASE:}
app.box.jwt-public-key-id=${BOX_JWT_PUBLIC_KEY_ID:}
app.box.retry-backoff-seconds=${BOX_RETRY_BACKOFF_SECONDS:60}

# Cross-year booking override (testing only — bypasses the Q4 calendar-window check)
# Set to true to allow booking vacations into Q1 of next year outside of Q4.
# Default: false (production behaviour — Q4 window enforced).
app.cross-year-booking-override=${CROSS_YEAR_BOOKING_OVERRIDE:false}

# Slack notifications
app.slack.enabled=${SLACK_ENABLED:false}
app.slack.webhook-url=${SLACK_WEBHOOK_URL:}
app.slack.pc-leave-code=${SLACK_PC_LEAVE_CODE:PC}
# Dedicated webhook for critical admin alerts (missing vacation planner data, etc.)
# Routes to a separate Slack channel from the main webhook.
# When empty, missing-year alerts fall back to the main webhook (if enabled).
app.slack.alert-webhook-url=${SLACK_ALERT_WEBHOOK_URL:}

# Logging
logging.level.com.holidayleave=${LOG_LEVEL:INFO}
logging.level.root=WARN
