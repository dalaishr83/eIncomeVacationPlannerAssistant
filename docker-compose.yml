services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holiday-leave-assistant
    image: holiday-leave-assistant:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Server port — must match the exposed container port
      FLASK_PORT: "8080"
      # Absolute paths so AppState.init() resolves dirs correctly inside the container
      DATA_DIR: "/app/data"
      REPORT_OUTPUT_DIR: "/app/reports"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
